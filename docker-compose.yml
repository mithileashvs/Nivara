# Minimal development setup: the FastAPI backend + MongoDB. Nothing else.
#
# Usage:
#   docker compose up --build          # start backend + MongoDB
#   docker compose exec backend python scripts/seed.py   # seed development data
#   docker compose down -v             # stop and wipe the MongoDB volume
#
# The app also runs perfectly well without Docker — see the README's "Installation" section.

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: smartcare
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-1234567890}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      APP_TIMEZONE: Asia/Kolkata
      BACKGROUND_JOBS_ENABLED: "true"
      LOG_LEVEL: INFO
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
