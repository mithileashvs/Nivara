# Minimal development setup: the FastAPI backend + PostgreSQL. Nothing else.
#
# Usage:
#   docker compose up --build          # start backend + PostgreSQL
#   docker compose exec backend python -m scripts.seed   # seed development data
#   docker compose down -v             # stop and wipe the PostgreSQL volume
#
# The app also runs perfectly well without Docker — see the README's "Installation" section.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nivara
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nivara"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/nivara
      DATABASE_NAME: nivara
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-1234567890}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      APP_TIMEZONE: Asia/Kolkata
      BACKGROUND_JOBS_ENABLED: "true"
      LOG_LEVEL: INFO
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
